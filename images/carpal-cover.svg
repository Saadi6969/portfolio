<svg width="600" height="340" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="600" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0e1a35"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg2)"/>
  <!-- glow -->
  <circle cx="300" cy="160" r="140" fill="#4b5fff" opacity="0.06"/>
  <circle cx="480" cy="80" r="70" fill="#f0a500" opacity="0.06"/>
  <!-- road -->
  <path d="M0 240 Q300 180 600 240" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.07"/>
  <path d="M0 260 Q300 200 600 260" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.07"/>
  <!-- dashes -->
  <line x1="100" y1="250" x2="140" y2="246" stroke="#f0a500" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="20,15"/>
  <line x1="260" y1="238" x2="300" y2="235" stroke="#f0a500" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="20,15"/>
  <line x1="420" y1="238" x2="460" y2="242" stroke="#f0a500" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="20,15"/>
  <!-- car body -->
  <rect x="230" y="150" width="140" height="60" rx="10" fill="#4b5fff" opacity="0.85"/>
  <rect x="250" y="130" width="100" height="40" rx="8" fill="#3a4de0" opacity="0.9"/>
  <!-- windows -->
  <rect x="258" y="135" width="38" height="28" rx="4" fill="#a0aaff" opacity="0.5"/>
  <rect x="304" y="135" width="38" height="28" rx="4" fill="#a0aaff" opacity="0.5"/>
  <!-- wheels -->
  <circle cx="262" cy="212" r="16" fill="#1a1a2e" stroke="#f0a500" stroke-width="2.5"/>
  <circle cx="262" cy="212" r="7" fill="#f0a500" opacity="0.7"/>
  <circle cx="338" cy="212" r="16" fill="#1a1a2e" stroke="#f0a500" stroke-width="2.5"/>
  <circle cx="338" cy="212" r="7" fill="#f0a500" opacity="0.7"/>
  <!-- headlights -->
  <ellipse cx="370" cy="168" rx="8" ry="5" fill="#fffbe6" opacity="0.8"/>
  <!-- location pin -->
  <circle cx="300" cy="90" r="14" fill="#ff5c3a" opacity="0.9"/>
  <circle cx="300" cy="90" r="6" fill="#ffffff" opacity="0.9"/>
  <line x1="300" y1="104" x2="300" y2="126" stroke="#ff5c3a" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4,3"/>
  <!-- label -->
  <text x="300" y="300" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f0a500" text-anchor="middle" letter-spacing="3">CAR-PAL</text>
  <text x="300" y="318" font-family="system-ui,sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" opacity="0.35" letter-spacing="1">FLUTTER · FIREBASE · GOOGLE MAPS</text>
</svg>